<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Contable</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #1b3b36;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            width: 850px;
            max-width: 95%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            min-height: 480px;
        }

        .login-form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-welcome-section {
            flex: 1;
            background: linear-gradient(135deg, #20c997, #0f5132);
            color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-top-left-radius: 120px;
            border-bottom-left-radius: 120px;
        }

        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #20c997;
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }

        .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-right: none;
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        .input-group .form-control {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .btn-custom-success {
            background-color: #20c997;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn-custom-success:hover {
            background-color: #1aa179;
            color: white;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            .login-welcome-section {
                border-radius: 0;
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Sección Izquierda: Formulario de Inicio de Sesión -->
        <div class="login-form-section">
            <h3 class="fw-bold mb-2 text-dark">Iniciar Sesión</h3>
            <p class="text-muted small mb-3">Use su correo y contraseña para acceder</p>

            <!-- Contenedor para alertas del sistema -->
            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Correo Electrónico" required>
                    </div>
                </div>

                <div class="mb-2">
                    <div class="input-group">
                        <span class="input-group-text text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="#" class="small text-muted text-decoration-none">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-custom-success mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>INICIAR SESIÓN
                </button>
            </form>
        </div>

        <!-- Sección Derecha: Panel de Bienvenida con Curva (Sin botones) -->
        <div class="login-welcome-section">
            <div class="mb-3">
                <i class="bi bi-bank fs-1"></i>
            </div>
            <h2 class="fw-bold mb-2">¡Bienvenido!</h2>
            <p class="small mb-0 text-light opacity-85">Ingrese sus datos personales para usar todas las funciones del sistema contable.</p>
        </div>
    </div>

    <!-- Script de autenticación -->
    <script src="js/auth.js"></script>
</body>
</html>
